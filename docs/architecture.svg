  <polyline points="1145,514 1145,566 810,566 810,605" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="970,665 1030,665" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1145,605 1145,570 875,570 875,605" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" stroke-dasharray="8 8" />

  <polyline points="820,729 820,776 950,776 950,800" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="795,390 795,330 1375,330 1375,298 1440,298" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1550,346 1550,455" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1550,577 1550,675" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />
  </g>
  <g filter="url(#shadow)">

  <g>
    <rect x="90" y="210" width="180" height="88" rx="18" fill="#dff3ff" stroke="#5fa8d3" stroke-width="2.4" />
    <text x="110" y="248" font-size="24" font-weight="700" fill="#13212b">Clients</text>
    <text x="110" y="274" font-size="14" fill="#3f5563">requests / keepalive traffic</text>
  </g>

  <g>
    <rect x="300" y="210" width="190" height="88" rx="18" fill="#ffe8c9" stroke="#d39a4f" stroke-width="2.4" />
    <text x="320" y="248" font-size="24" font-weight="700" fill="#13212b">Acceptor</text>
    <text x="320" y="274" font-size="14" fill="#3f5563">accept loop drains backlog</text>
  </g>

  <g>
    <rect x="160" y="385" width="300" height="120" rx="18" fill="#d8ecff" stroke="#4e8ec6" stroke-width="2.4" />
    <text x="180" y="423" font-size="24" font-weight="700" fill="#13212b">MainReactor</text>
    <text x="180" y="449" font-size="14" fill="#3f5563">base EventLoop with epoll + eventfd</text>
  </g>

  <g>
    <rect x="160" y="585" width="300" height="124" rx="18" fill="#e7f0ff" stroke="#6c90c8" stroke-width="2.4" />
    <text x="180" y="623" font-size="24" font-weight="700" fill="#13212b">TcpServer</text>
    <text x="180" y="649" font-size="14" fill="#3f5563">baseloop registry + dispatch policy</text>
  </g>

  <g>
    <rect x="610" y="210" width="320" height="88" rx="18" fill="#e6f7df" stroke="#77a95d" stroke-width="2.4" />
    <text x="630" y="248" font-size="24" font-weight="700" fill="#13212b">EventLoopThreadPool</text>
    <text x="630" y="274" font-size="14" fill="#3f5563">round-robin dispatch to workers</text>
  </g>

  <g>
    <rect x="1020" y="210" width="260" height="88" rx="18" fill="#e3f2d9" stroke="#7eab63" stroke-width="2.4" />
    <text x="1040" y="248" font-size="24" font-weight="700" fill="#13212b">SubReactors</text>
    <text x="1040" y="274" font-size="14" fill="#3f5563">multiple EventLoop threads</text>
  </g>

  <g>
    <rect x="640" y="390" width="310" height="124" rx="18" fill="#d8f0d0" stroke="#6d9960" stroke-width="2.4" />
    <text x="660" y="428" font-size="24" font-weight="700" fill="#13212b">EventLoop</text>
    <text x="660" y="454" font-size="14" fill="#3f5563">epoll, wakeup, owner-thread tasks</text>
  </g>

  <g>
    <rect x="1030" y="390" width="230" height="124" rx="18" fill="#eef7dd" stroke="#91ad5a" stroke-width="2.4" />
    <text x="1050" y="428" font-size="24" font-weight="700" fill="#13212b">Channel</text>
    <text x="1050" y="454" font-size="14" fill="#3f5563">fd event wrapper + callbacks</text>
  </g>

  <g>
    <rect x="640" y="605" width="330" height="124" rx="18" fill="#dff3d7" stroke="#6fa05e" stroke-width="2.4" />
    <text x="660" y="643" font-size="24" font-weight="700" fill="#13212b">TcpConnection</text>
    <text x="660" y="669" font-size="14" fill="#3f5563">owner-loop init, read/write, close flow</text>
  </g>

  <g>
    <rect x="1030" y="605" width="230" height="124" rx="18" fill="#f1f8d8" stroke="#9eb34e" stroke-width="2.4" />
    <text x="1050" y="643" font-size="24" font-weight="700" fill="#13212b">TimerWheel</text>
    <text x="1050" y="669" font-size="14" fill="#3f5563">timerfd + heartbeat buckets</text>
  </g>

  <g>
    <rect x="720" y="800" width="460" height="96" rx="18" fill="#edf0ff" stroke="#7e86cc" stroke-width="2.4" />
    <text x="740" y="838" font-size="20" font-weight="700" fill="#13212b">User Callback /</text>
    <text x="740" y="862" font-size="20" font-weight="700" fill="#13212b">Protocol Layer</text>
    <text x="740" y="888" font-size="13" fill="#3f5563">length-prefixed parsing and business logic</text>
  </g>

  <g>
    <rect x="1440" y="250" width="220" height="96" rx="18" fill="#fff1db" stroke="#d39a4f" stroke-width="2.4" />
    <text x="1460" y="288" font-size="24" font-weight="700" fill="#13212b">Logger</text>
    <text x="1460" y="314" font-size="14" fill="#3f5563">front-end logging macros</text>
  </g>

  <g>
    <rect x="1440" y="455" width="220" height="122" rx="18" fill="#ffe6c4" stroke="#cc8b3f" stroke-width="2.4" />
    <text x="1460" y="493" font-size="24" font-weight="700" fill="#13212b">AsyncLogging</text>
    <text x="1460" y="519" font-size="14" fill="#3f5563">buffer queue + dedicated flush thread</text>
  </g>

  <g>
    <rect x="1440" y="675" width="220" height="88" rx="18" fill="#fff7e8" stroke="#d4ab67" stroke-width="2.4" />
    <text x="1460" y="713" font-size="24" font-weight="700" fill="#13212b">Log File</text>
    <text x="1460" y="739" font-size="14" fill="#3f5563">pid*.log / benchmark output</text>
  </g>
  </g>
  <g>

    <text x="284" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">connect</text>

    <text x="370" y="334" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">drain accept</text>

    <text x="366" y="552" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">base loop</text>

    <text x="546" y="630" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">choose io loop</text>

    <text x="975" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">worker loops</text>

    <text x="1052" y="344" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">owner-loop init</text>

    <text x="990" y="438" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">epoll events</text>

    <text x="980" y="548" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">callbacks</text>

    <text x="1000" y="646" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">heartbeat refresh</text>

    <text x="1080" y="556" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">idle timeout</text>

    <text x="888" y="768" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">protocol dispatch</text>

    <text x="1355" y="318" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">runtime logs</text>

    <text x="1588" y="408" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">append</text>

    <text x="1582" y="632" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">flush</text>
    <text x="60" y="972" font-size="13" fill="#304958">MainReactor drains the accept backlog, TcpServer dispatches sockets to SubReactors, and each owner EventLoop initializes TcpConnection, heartbeat state, and protocol callbacks before I/O is activated.</text>
    <text x="60" y="994" font-size="13" fill="#304958">Logger appends through AsyncLogging, which keeps buffer ownership separate from backend wakeups and flushes batched output to disk.</text>
  </g>
</svg>