<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1040" viewBox="0 0 1760 1040">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9fc" />
      <stop offset="100%" stop-color="#fdf7ee" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#708090" flood-opacity="0.12" />
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4c667c" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <text x="60" y="66" font-size="34" font-weight="800" fill="#10202d">reactor Architecture</text>
  <text x="60" y="98" font-size="16" fill="#4b6271">C++17, epoll, eventfd, one loop per thread, timer wheel heartbeat, async logging</text>

  <g>
    <rect x="60" y="130" width="460" height="800" rx="28" fill="#f8fbff" stroke="#85a8c6" stroke-width="2.5" stroke-dasharray="10 10" />
    <text x="84" y="168" font-size="26" font-weight="700" fill="#0e2433">Main Reactor Plane</text>
    <text x="84" y="192" font-size="13" fill="#496272">acceptor thread + base EventLoop</text>
  </g>

  <g>
    <rect x="560" y="130" width="820" height="800" rx="28" fill="#fbfcf7" stroke="#92b07f" stroke-width="2.5" stroke-dasharray="10 10" />
    <text x="584" y="168" font-size="26" font-weight="700" fill="#0e2433">Sub Reactors Plane</text>
    <text x="584" y="192" font-size="13" fill="#496272">owner-loop initialization and connection I/O</text>
  </g>

  <g>
    <rect x="1410" y="130" width="290" height="800" rx="28" fill="#fffaf4" stroke="#d8ac67" stroke-width="2.5" stroke-dasharray="10 10" />
    <text x="1434" y="168" font-size="26" font-weight="700" fill="#0e2433">Shared Services</text>
    <text x="1434" y="192" font-size="13" fill="#496272">cross-cutting runtime components</text>
  </g>
  <g>

  <polyline points="270,254 300,254" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="395,298 395,346 310,346 310,385" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="310,505 310,585" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="460,646 535,646 535,254 610,254" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="930,254 1020,254" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1150,298 1150,352 795,352 795,390" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

