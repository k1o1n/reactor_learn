<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9fc" />
      <stop offset="100%" stop-color="#fdf7ee" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#708090" flood-opacity="0.12" />
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4c667c" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <text x="60" y="64" font-size="34" font-weight="800" fill="#10202d">reactor Architecture</text>
  <text x="60" y="95" font-size="16" fill="#4b6271">C++17, epoll, eventfd, one loop per thread, timer wheel heartbeat, async logging</text>

  <g>
    <rect x="60" y="120" width="430" height="760" rx="28" fill="#f8fbff" stroke="#85a8c6" stroke-width="2.5" stroke-dasharray="10 10" />
    <text x="84" y="158" font-size="26" font-weight="700" fill="#0e2433">Main Reactor Plane</text>
    <text x="84" y="182" font-size="13" fill="#496272">acceptor thread + base EventLoop</text>
  </g>

  <g>
    <rect x="540" y="120" width="760" height="760" rx="28" fill="#fbfcf7" stroke="#92b07f" stroke-width="2.5" stroke-dasharray="10 10" />
    <text x="564" y="158" font-size="26" font-weight="700" fill="#0e2433">Sub Reactors Plane</text>
    <text x="564" y="182" font-size="13" fill="#496272">one loop per thread for connection I/O</text>
  </g>

  <g>
    <rect x="1330" y="120" width="290" height="760" rx="28" fill="#fffaf4" stroke="#d8ac67" stroke-width="2.5" stroke-dasharray="10 10" />
    <text x="1354" y="158" font-size="26" font-weight="700" fill="#0e2433">Shared Services</text>
    <text x="1354" y="182" font-size="13" fill="#496272">cross-cutting runtime components</text>
  </g>
  <g>

  <polyline points="260,233 285,233" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="372,276 372,320 290,320 290,350" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="290,466 290,535" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="425,593 505,593 505,233 610,233" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="910,233 980,233" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1100,276 1100,332 770,332 770,370" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="910,428 970,428" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1080,486 1080,528 780,528 780,570" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="930,628 970,628" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1080,570 1080,540 840,540 840,570" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" stroke-dasharray="8 8" />

  <polyline points="780,686 780,728 920,728 920,742" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="770,370 770,315 1285,315 1285,286 1370,286" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1480,332 1480,430" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />

  <polyline points="1480,542 1480,630" fill="none" stroke="#4c667c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />
  </g>
  <g filter="url(#shadow)">

  <g>
    <rect x="90" y="190" width="170" height="86" rx="18" fill="#dff3ff" stroke="#5fa8d3" stroke-width="2.4" />
    <text x="110" y="228" font-size="24" font-weight="700" fill="#13212b">Clients</text>
    <text x="110" y="254" font-size="14" fill="#3f5563">requests / keepalive traffic</text>
  </g>

  <g>
    <rect x="285" y="190" width="175" height="86" rx="18" fill="#ffe8c9" stroke="#d39a4f" stroke-width="2.4" />
    <text x="305" y="228" font-size="24" font-weight="700" fill="#13212b">Acceptor</text>
    <text x="305" y="254" font-size="14" fill="#3f5563">listen + accept new fds</text>
  </g>

  <g>
    <rect x="155" y="350" width="270" height="116" rx="18" fill="#d8ecff" stroke="#4e8ec6" stroke-width="2.4" />
    <text x="175" y="388" font-size="24" font-weight="700" fill="#13212b">MainReactor</text>
    <text x="175" y="414" font-size="14" fill="#3f5563">base EventLoop with epoll + eventfd</text>
  </g>

  <g>
    <rect x="155" y="535" width="270" height="116" rx="18" fill="#e7f0ff" stroke="#6c90c8" stroke-width="2.4" />
    <text x="175" y="573" font-size="24" font-weight="700" fill="#13212b">TcpServer</text>
    <text x="175" y="599" font-size="14" fill="#3f5563">owns acceptor thread and thread pool</text>
  </g>

  <g>
    <rect x="610" y="190" width="300" height="86" rx="18" fill="#e6f7df" stroke="#77a95d" stroke-width="2.4" />
    <text x="630" y="228" font-size="24" font-weight="700" fill="#13212b">EventLoopThreadPool</text>
    <text x="630" y="254" font-size="14" fill="#3f5563">round-robin dispatch to workers</text>
  </g>

  <g>
    <rect x="980" y="190" width="240" height="86" rx="18" fill="#e3f2d9" stroke="#7eab63" stroke-width="2.4" />
    <text x="1000" y="228" font-size="24" font-weight="700" fill="#13212b">SubReactors</text>
    <text x="1000" y="254" font-size="14" fill="#3f5563">multiple EventLoop threads</text>
  </g>

  <g>
    <rect x="630" y="370" width="280" height="116" rx="18" fill="#d8f0d0" stroke="#6d9960" stroke-width="2.4" />
    <text x="650" y="408" font-size="24" font-weight="700" fill="#13212b">EventLoop</text>
    <text x="650" y="434" font-size="14" fill="#3f5563">epoll, wakeup, task queue</text>
  </g>

  <g>
    <rect x="970" y="370" width="220" height="116" rx="18" fill="#eef7dd" stroke="#91ad5a" stroke-width="2.4" />
    <text x="990" y="408" font-size="24" font-weight="700" fill="#13212b">Channel</text>
    <text x="990" y="434" font-size="14" fill="#3f5563">fd event wrapper + callbacks</text>
  </g>

  <g>
    <rect x="630" y="570" width="300" height="116" rx="18" fill="#dff3d7" stroke="#6fa05e" stroke-width="2.4" />
    <text x="650" y="608" font-size="24" font-weight="700" fill="#13212b">TcpConnection</text>
    <text x="650" y="634" font-size="14" fill="#3f5563">read/write buffer, close flow, OnMessage</text>
  </g>

  <g>
    <rect x="970" y="570" width="220" height="116" rx="18" fill="#f1f8d8" stroke="#9eb34e" stroke-width="2.4" />
    <text x="990" y="608" font-size="24" font-weight="700" fill="#13212b">TimerWheel</text>
    <text x="990" y="634" font-size="14" fill="#3f5563">timerfd-driven heartbeat buckets</text>
  </g>

  <g>
    <rect x="720" y="742" width="400" height="108" rx="18" fill="#edf0ff" stroke="#7e86cc" stroke-width="2.4" />
    <text x="740" y="780" font-size="20" font-weight="700" fill="#13212b">User Callback /</text>
    <text x="740" y="804" font-size="20" font-weight="700" fill="#13212b">Protocol Layer</text>
    <text x="740" y="830" font-size="13" fill="#3f5563">length-prefixed parsing</text>
    <text x="740" y="848" font-size="13" fill="#3f5563">and business logic</text>
  </g>

  <g>
    <rect x="1370" y="240" width="220" height="92" rx="18" fill="#fff1db" stroke="#d39a4f" stroke-width="2.4" />
    <text x="1390" y="278" font-size="24" font-weight="700" fill="#13212b">Logger</text>
    <text x="1390" y="304" font-size="14" fill="#3f5563">front-end logging macros</text>
  </g>

  <g>
    <rect x="1370" y="430" width="220" height="112" rx="18" fill="#ffe6c4" stroke="#cc8b3f" stroke-width="2.4" />
    <text x="1390" y="468" font-size="24" font-weight="700" fill="#13212b">AsyncLogging</text>
    <text x="1390" y="494" font-size="14" fill="#3f5563">double buffer + flush thread</text>
  </g>

  <g>
    <rect x="1370" y="630" width="220" height="86" rx="18" fill="#fff7e8" stroke="#d4ab67" stroke-width="2.4" />
    <text x="1390" y="668" font-size="24" font-weight="700" fill="#13212b">Log File</text>
    <text x="1390" y="694" font-size="14" fill="#3f5563">pid*.log / benchmark output</text>
  </g>
  </g>
  <g>

    <text x="272" y="220" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">connect</text>

    <text x="340" y="309" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">accept</text>

    <text x="348" y="505" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">own base loop</text>

    <text x="533" y="580" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">round-robin</text>

    <text x="944" y="220" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">worker loops</text>

    <text x="1000" y="324" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">one loop per thread</text>

    <text x="940" y="415" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">epoll events</text>

    <text x="985" y="520" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">callbacks</text>

    <text x="952" y="616" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">heartbeat refresh</text>

    <text x="952" y="533" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">idle timeout</text>

    <text x="860" y="720" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">protocol dispatch</text>

    <text x="1280" y="304" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">runtime logs</text>

    <text x="1518" y="388" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">append</text>

    <text x="1516" y="592" font-size="12" font-weight="600" text-anchor="middle" fill="#445d71">flush</text>
    <rect x="60" y="902" width="1560" height="42" rx="14" fill="#ffffff" opacity="0.92" stroke="#d7e2e9" />
    <text x="84" y="929" font-size="13" fill="#304958">MainReactor accepts new connections and TcpServer dispatches sockets to SubReactors. Each worker EventLoop manages Channel and TcpConnection I/O. TimerWheel handles heartbeat expiry. Logger writes through AsyncLogging to disk.</text>
  </g>
</svg>